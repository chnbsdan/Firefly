# 后端配置 - 使用 GitHub 存储内容
backend:
  name: github
  repo: chnbsdan/Firefly  # ⚠️ 必须修改！例如: chnbsdan/Firefly
  branch: main                        # 你的默认分支，可能是 main 或 master

# 本地开发时启用本地后台（用于测试）
local_backend: true

# 图片等媒体文件的上传路径
media_folder: "public/assets/images/posts"
public_folder: "/assets/images/posts"

# 定义博客文章的集合
collections:
  - name: "posts"
    label: "博客文章"
    folder: "src/content/posts"      # ⚠️ Firefly 的文章存放路径
    create: true                     # 允许创建新文章
    slug: "{{slug}}"
    path: "{{slug}}/index"
    editor:
      preview: false
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "published", widget: "datetime" }
      - { label: "描述", name: "description", widget: "text", required: false }
      - { label: "封面图", name: "image", widget: "image", required: false, default: "./cover.jpg" }
      - { label: "标签", name: "tags", widget: "list", required: false }
      - { label: "分类", name: "category", widget: "string", required: false }
      - { label: "草稿", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "置顶", name: "pinned", widget: "boolean", default: false, required: false }
      - { label: "正文内容", name: "body", widget: "markdown" }
